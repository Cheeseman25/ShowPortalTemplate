# Builds the site on every push (a check that it compiles). Deploying to GitHub Pages is OFF by default:
# the AWS model hosts the site on S3 + CloudFront (see aws/README.md).
# To also publish on GitHub Pages: repo Settings -> Pages -> Source: "GitHub Actions", then
# Settings -> Secrets and variables -> Actions -> Variables -> add PAGES_DEPLOY = true.
name: Build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
